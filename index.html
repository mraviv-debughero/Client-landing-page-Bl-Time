<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Session</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 24px; max-width: 360px; margin: 40px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .timer { font-size: 3rem; font-weight: bold; margin: 20px 0; color: #4CAF50; }
    .warning { color: #FF9800 !important; }
    .btn { background: #007AFF; color: #fff; border: none; padding: 14px 20px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
    .status { font-size: 0.85rem; color: #aaa; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="tableTitle">Table Session</h1>
    <p style="color: #888; font-size: 0.9rem;">Your session is active. Keep this tab open or enable push alerts below.</p>
    
    <div id="timerDisplay" class="timer">45:00</div>

    <button id="notifyBtn" class="btn" onclick="enablePushNotifications()">🔔 Enable 7-Min Expiry Alert</button>
    <div id="statusText" class="status">No personal data required.</div>
  </div>

  <audio id="chimeSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    const SCRIPT_URL = "YOUR_WEB_APP_URL_HERE"; // <--- REPLACE THIS WITH YOUR WEB APP URL

    // 1. Parse Table Number from URL query parameter (?table=1)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNum = urlParams.get('table') || '1';
    document.getElementById('tableTitle').innerText = "Table " + tableNum + " Session";

    // 2. Local 45-Minute Visual Countdown (2700 Seconds)
    let totalSeconds = 45 * 60;
    const timerElement = document.getElementById('timerDisplay');
    const chimeSound = document.getElementById('chimeSound');
    let alertPlayed = false;

    const countdown = setInterval(() => {
      totalSeconds--;
      let mins = Math.floor(totalSeconds / 60);
      let secs = totalSeconds % 60;
      timerElement.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

      // Trigger Audio & Color Warning at 7 Minutes Remaining (420 Seconds)
      if (totalSeconds <= 420 && !alertPlayed) {
        timerElement.classList.add('warning');
        chimeSound.play().catch(e => console.log('Audio autoplay blocked'));
        alertPlayed = true;
      }

      if (totalSeconds <= 0) {
        clearInterval(countdown);
        timerElement.innerText = "0:00";
      }
    }, 1000);

    // 3. Anonymous Push Alert Token Registration
    async function enablePushNotifications() {
      const btn = document.getElementById('notifyBtn');
      const status = document.getElementById('statusText');

      if (!('Notification' in window)) {
        status.innerText = "Notifications not supported on this browser. Keep tab open for chime.";
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          // Generate a temporary 16-character random token for this device
          const tempToken = 'TOKEN_' + Math.random().toString(36).substring(2, 10) + Date.now();

          // Send anonymous token + table number to Google Apps Script
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ table: tableNum, token: tempToken })
          });

          btn.innerText = "✓ Alerts Enabled";
          btn.style.background = "#34C759";
          btn.disabled = true;
          status.innerText = "You will receive a notification 7 minutes before expiry.";
        } else {
          status.innerText = "Permission denied. Keep tab open to see the live timer.";
        }
      } catch (err) {
        status.innerText = "Could not enable alerts. Keep tab open for chime.";
      }
    }
  </script>
</body>
</html>
